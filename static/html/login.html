<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncUp — Log in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style/loginregister.css">
    <link rel="icon" type="image/png" href="/static/imgs/logo.png">
</head>
<body>

    <div class="grain"></div>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <header>
        <a href="/static/html/landingpage.html" class="logo">
            <span class="logo-mark">S</span>
            <span class="logo-text">SyncUp</span>
        </a>
    </header>

    <main>
        <div class="auth-card">
            <div class="auth-header">
                <p class="auth-eyebrow">Welcome back</p>
                <h1 class="auth-title">Log <em>in</em></h1>
                <p class="auth-sub">Good to see you again. Pick up where you left off.</p>
            </div>

            <form class="auth-form" onsubmit="doLogin(event)">
                <div class="field-group">
                    <label for="username">Username</label>
                    <div class="input-wrap">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="username" placeholder="your username" required>
                    </div>
                </div>

                <div class="field-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    Log in
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M3 10a.75.75 0 01.75-.75h10.638L10.23 5.29a.75.75 0 111.04-1.08l5.5 5.25a.75.75 0 010 1.08l-5.5 5.25a.75.75 0 11-1.04-1.08l4.158-3.96H3.75A.75.75 0 013 10z" clip-rule="evenodd"/>
                    </svg>
                </button>
            </form>

            <p class="auth-switch">
                Don't have an account? <a href="/static/html/register.html">Register</a>
            </p>
        </div>

        <div class="auth-deco">
            <blockquote>
                "The key is not to prioritize what's on your schedule,<br>but to schedule your priorities."
            </blockquote>
            <cite>— Stephen Covey</cite>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script src="/static/script/login.js"></script>
</body>
</html>
