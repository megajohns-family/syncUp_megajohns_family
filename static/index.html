<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncUp — Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="/static/indexmain.css">

    <style>
        main {
            position: relative;
            z-index: 1;
            padding: 110px 48px 80px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .dashboard-header {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
        }

        @media (min-width: 768px) {
            .dashboard-header {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }

        .dashboard-title {
            font-family: var(--font-display);
            font-size: clamp(42px, 5vw, 58px);
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -2.5px;
            color: var(--ink);
            max-width: 600px;
        }

        .new-list-bar {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 420px;
        }

        @media (max-width: 600px) {
            .new-list-bar {
                flex-direction: column;
            }

            .new-list-bar button {
                height: 48px;
            }
        }

        .new-list-bar input {
            flex: 1;
            padding: 16px 20px;
            border-radius: 12px;
            border: 1.5px solid var(--border);
            background: rgba(253,246,235,0.95);
            font-size: 15px;
            color: var(--ink);
        }

        .new-list-bar button {
            padding: 0 28px;
            background: var(--ink);
            color: var(--cream);
            border: none;
            border-radius: 12px;
            font-weight: 500;
            cursor: pointer;
        }

        .lists-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .list-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 12px 40px rgba(26,18,8,0.08);
            transition: all 0.25s ease;
        }

        .list-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 45px rgba(26,18,8,0.12);
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .list-name {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            color: var(--ink);
        }

        .task-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 0;
            border-top: 1px solid var(--border);
        }

        .task-item:first-child {
            border-top: none;
            padding-top: 0;
        }

        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-top: 3px;
            flex-shrink: 0;
        }

        .color-GREEN { background: #5cb85c; }
        .color-RED { background: #d9534f; }
        .color-YELLOW { background: #f0ad4e; }
        .color-BLUE { background: #4285f4; }
        .color-PURPLE { background: #9b59b6; }
        .color-NOTHING { border: 2px solid #b0a090; }

        .task-name { font-size: 15px; }
        .task-desc { font-size: 13px; color: var(--muted); }

        .new-task-form {
            margin-top: 18px;
            display: flex;
            gap: 10px;
        }

        .new-task-form input {
            flex: 1;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
        }

        .new-task-form button {
            width: 46px;
            background: var(--amber);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 40px 10px;
            color: var(--muted);
            font-style: italic;
        }

        .toast {
            position: fixed;
            top: 82px;
            right: 30px;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(26,18,8,0.25);
            font-size: 15px;
            z-index: 9999;
            display: none;
            align-items: center;
            min-width: 260px;
        }

        .toast.success { background: #5cb85c; color: white; }
        .toast.error   { background: #d9534f; color: white; }
    </style>
</head>

<body>

<div class="grain"></div>
<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>
<div class="bg-orb orb-3"></div>

<header>
    <a href="/static/landingpage.html" class="logo">
        <span class="logo-mark">S</span>
        <span class="logo-text">SyncUp</span>
    </a>

    <nav class="nav-links">
        <span style="color:var(--muted);">
            Hi, <span id="username-label" style="color:var(--ink);font-weight:500;"></span>
        </span>
        <button onclick="logout()" style="margin-left:20px;background:var(--ink);color:var(--cream);padding:9px 22px;border:none;border-radius:10px;cursor:pointer;">Log out</button>
    </nav>
</header>

<main>
    <div class="dashboard-header">
        <h1 class="dashboard-title">
            Your tasks,<br>perfectly in sync
        </h1>

        <div class="new-list-bar">
            <input type="text" id="new-list-name" placeholder="Create a new list..." onkeypress="if(event.key==='Enter') createList()">
            <button onclick="createList()">Create</button>
        </div>
    </div>

    <div id="loading" style="display:none;text-align:center;padding:80px;color:var(--muted);">
        Loading your workspace...
    </div>

    <div class="lists-grid" id="lists-grid"></div>
</main>

<div id="toast" class="toast"></div>

<script>
/* JS bez zmian */
const API = '';
const getToken = () => localStorage.getItem('token');
const getUser  = () => localStorage.getItem('username');
const clearAuth = () => localStorage.clear();

function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type}`;
    t.style.display = 'flex';
    setTimeout(() => t.style.display = 'none', 3200);
}

window.onload = () => {
    if (!getToken()) return window.location.href = '/static/login.html';
    document.getElementById('username-label').textContent = getUser() || 'User';
    loadLists();
};

function logout() {
    clearAuth();
    window.location.href = '/static/landingpage.html';
}

const authHeaders = () => ({
    'Content-Type': 'application/json',
    'Authorization': `Bearer ${getToken()}`
});

async function apiFetch(path, opts = {}) {
    const res = await fetch(API + path, { headers: authHeaders(), ...opts });
    if (res.status === 401) logout();
    return res;
}

async function loadLists() {
    document.getElementById('loading').style.display = '';
    document.getElementById('lists-grid').innerHTML = '';
    const res = await apiFetch('/lists');
    document.getElementById('loading').style.display = 'none';
    if (!res) return;
    renderLists(await res.json());
}

function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderLists(data) {
    const grid = document.getElementById('lists-grid');
    grid.innerHTML = '';
    const entries = Object.entries(data || {});

    if (entries.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:120px 20px;color:var(--muted);font-size:18px;">
            No lists yet.<br>Create one above 👆
        </div>`;
        return;
    }

    for (const [id, list] of entries) {
        const card = document.createElement('div');
        card.className = 'list-card';

        const tasks = list.tasks ? Object.entries(list.tasks) : [];

        let html = tasks.length ? tasks.map(([tid, t]) => `
            <div class="task-item">
                <div class="color-dot color-${(t.color_tag||'NOTHING').toUpperCase()}"></div>
                <div style="flex:1">
                    <div class="task-name">${esc(t.name)}</div>
                    ${t.description ? `<div class="task-desc">${esc(t.description)}</div>` : ''}
                </div>
                <button onclick="deleteTask('${tid}')" style="background:none;border:none;color:#b0a090;font-size:22px;cursor:pointer;">✕</button>
            </div>`).join('')
            : `<div class="empty-state">This list is empty</div>`;

        card.innerHTML = `
            <div class="list-header">
                <span class="list-name">${esc(list.name)}</span>
                <button onclick="deleteList('${id}')" class="delete-list-btn">✕</button>
            </div>
            ${html}
            <div class="new-task-form">
                <input type="text" id="task-input-${id}" placeholder="New task..." onkeypress="if(event.key==='Enter') createTask('${id}')">
                <button onclick="createTask('${id}')">+</button>
            </div>`;

        grid.appendChild(card);
    }
}

async function createList() {
    const name = document.getElementById('new-list-name').value.trim();
    if (!name) return;
    document.getElementById('new-list-name').value = '';
    const res = await apiFetch('/lists', {method:'POST', body:JSON.stringify({name})});
    if (res?.ok) { showToast('List created'); loadLists(); }
}

async function deleteList(id) {
    if (!confirm('Delete this list?')) return;
    const res = await apiFetch(`/lists/${id}`, {method:'DELETE'});
    if (res?.ok) { showToast('List deleted'); loadLists(); }
}

async function createTask(listId) {
    const input = document.getElementById(`task-input-${listId}`);
    const name = input.value.trim();
    if (!name) return;
    input.value = '';
    const res = await apiFetch(`/lists/${listId}/tasks`, {
        method:'POST',
        body:JSON.stringify({name, description:''})
    });
    if (res?.ok) { showToast('Task added'); loadLists(); }
}

async function deleteTask(taskId) {
    if (!confirm('Delete this task?')) return;
    const res = await apiFetch(`/tasks/${taskId}`, {method:'DELETE'});
    if (res?.ok) { showToast('Task deleted'); loadLists(); }
}
</script>

</body>
</html>
